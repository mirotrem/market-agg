version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  poller:
    build: .
    command: python -m app.poller_service
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    # Traefik's Docker-socket provider ships a vendored client hardcoded to API 1.24, which
    # this host's Docker daemon (requires >=1.44) rejects outright, with no override flag
    # available. Using the static file provider instead avoids the Docker socket entirely.
    # traefik/dynamic.yml lists each api replica's container name explicitly - a single
    # "http://api:8000" entry does NOT round-robin across replicas in practice, since
    # Traefik keeps a persistent connection to whichever IP it resolves first.
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
