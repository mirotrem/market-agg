http:
  routers:
    api-refresh:
      rule: "PathPrefix(`/api/refresh`)"
      service: api
      entryPoints:
        - web
      middlewares:
        - local-only
      priority: 10
    api:
      rule: "PathPrefix(`/`)"
      service: api
      entryPoints:
        - web
      priority: 1
  middlewares:
    local-only:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"
          - "::1/128"
          # Docker's NAT rewrites a loopback-originated connection to a published port as
          # coming from the bridge network's gateway, not literal 127.0.0.1 - confirmed via
          # Traefik's access log (--accesslog=true). That gateway IP isn't stable: a full
          # stack recreation (not just a container restart) can reassign the bridge network
          # to a different subnet entirely (observed firsthand: 172.21.0.0/16 -> 172.20.0.0/16
          # across one recreate). Rather than chase the specific address every time, this
          # allowlists the whole private range Docker's default bridge networks are drawn
          # from (172.17.0.0/16 through 172.31.0.0/16) - a real internet attacker can't
          # complete a TCP handshake with a spoofed private-range source anyway, since the
          # return traffic has nowhere real to route back to.
          - "172.16.0.0/12"
  services:
    api:
      loadBalancer:
        # A single "http://api:8000" entry does NOT round-robin across scaled replicas in
        # practice - Traefik treats it as one backend and keeps a persistent connection to
        # whichever IP it resolved first, since the real fix (Traefik's Docker-socket
        # provider, auto-discovering replicas) is unusable on this host - see docker-compose.yml.
        # Each replica's own container name is listed explicitly instead; this list has to
        # be updated by hand to match however many replicas `--scale api=N` is running.
        servers:
          - url: "http://market-agg_api_1:8000"
